name: 🔍 CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: ✅ Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔎 Type check
        run: bun run typecheck

      - name: 🧹 Lint
        run: bun run lint

      - name: 💅 Format check
        run: bun run format:check

  build-smoke:
    name: 🔨 Build smoke (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install npm dependencies
        run: bun install --frozen-lockfile

      - name: 🛠️ Prepare Hutch devkit
        run: npx electrobun prepare

      - name: ⚡ Build Vite UI
        run: bun x vite build

      - name: 🏗️ Build Electrobun app (dev)
        run: npx electrobun build --env=dev
