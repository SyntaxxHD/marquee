name: 🚀 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    name: ✅ Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔎 Type check
        run: bun run typecheck

      - name: 🧹 Lint
        run: bun run lint

  build:
    name: 🔨 Build ${{ matrix.artifact }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: marquee-macos
          - os: ubuntu-latest
            artifact: marquee-linux
          - os: windows-latest
            artifact: marquee-windows

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install npm dependencies
        run: bun install --frozen-lockfile

      - name: ♻️ Restore vendor cache
        id: cache-vendor
        uses: actions/cache@v4
        with:
          path: vendor/
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/download-bins.ts', 'scripts/build-atvremote.ts') }}

      - name: ⬇️ Download binaries into vendor/
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: bun run download-bins

      - name: 📺 Build atvremote into vendor/
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: |
          pip install "pyinstaller>=6,<7"
          pip install "git+https://github.com/postlund/pyatv.git@refs/pull/2899/head"
          bun run scripts/build-atvremote.ts

      - name: 🛠️ Prepare Hutch devkit
        run: npx electrobun prepare

      - name: ⚡ Build Vite UI
        run: bun x vite build

      - name: 🔐 Import signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: 🏗️ Build Electrobun app
        run: npx electrobun build --env=stable
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTROBUN_APPLEID: ${{ secrets.APPLE_ID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: 🔎 List artifacts
        shell: bash
        run: ls -1 artifacts/

      - name: ⬆️ Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          retention-days: 7

  release:
    name: 📦 Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏷️ Get version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: marquee ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*
          fail_on_unmatched_files: false
