name: 🔍 CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: ✅ Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔎 Type check
        run: bun run typecheck

      - name: 🧹 Lint
        run: bun run lint

      - name: 💅 Format check
        run: bun run format:check

  build-smoke:
    name: 🔨 Build smoke (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install npm dependencies
        run: bun install --frozen-lockfile

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ♻️ Restore vendor cache
        id: cache-vendor
        uses: actions/cache@v4
        with:
          path: vendor/
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/download-bins.ts', 'scripts/build-atvremote.ts') }}

      - name: ⬇️ Download binaries into vendor/
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: bun run download-bins

      - name: 📺 Build atvremote into vendor/
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: |
          pip install "pyinstaller>=6,<7"
          pip install "git+https://github.com/postlund/pyatv.git@refs/pull/2899/head"
          bun run scripts/build-atvremote.ts

      - name: 🛠️ Prepare Hutch devkit
        run: npx electrobun prepare

      - name: ⚡ Build Vite UI
        run: bun x vite build

      - name: 🏗️ Build Electrobun app (dev)
        run: npx electrobun build --env=dev
